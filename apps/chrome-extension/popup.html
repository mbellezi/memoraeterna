<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memora Eterna</title>
    <style>
      body { width: 340px; margin: 0; padding: 16px; color: #172033; background: #f8fafc; font: 13px system-ui, sans-serif; }
      h1 { margin: 0 0 14px; font-size: 18px; } label { display: grid; gap: 5px; margin: 9px 0; font-weight: 600; }
      input { height: 32px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 9px; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
      button { min-height: 34px; border: 0; border-radius: 6px; background: #0e7490; color: white; font-weight: 650; cursor: pointer; }
      button.secondary { background: #475569; } #save { width: 100%; margin-top: 8px; background: #7c3aed; }
      #status { min-height: 18px; margin: 12px 0 0; color: #475569; }
    </style>
  </head>
  <body>
    <h1 data-i18n="extensionName"></h1>
    <label><span data-i18n="gatewayAddress"></span><input id="gatewayBaseUrl" type="url" /></label>
    <label><span data-i18n="clientId"></span><input id="clientId" /></label>
    <label><span data-i18n="pairingToken"></span><input id="pairingToken" type="password" /></label>
    <button id="save" data-i18n="saveConnection"></button>
    <div class="actions">
      <button id="capturePage" data-i18n="capturePage"></button>
      <button id="captureSelection" class="secondary" data-i18n="captureSelection"></button>
    </div>
    <p id="status" role="status"></p>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
