/* ============================================================================================ BASE */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{min-width:960px;background:var(--surface-canvas);color:var(--text-primary);font:400 var(--type-body)/1.5 var(--font-family-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
body.board-page{overflow:auto;height:auto}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none;cursor:pointer}
h1,h2,h3,h4,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
/* Overlay-style scrollbars: thin, shown on hover of the scrolling region only. */
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:transparent;border-radius:4px}
*:hover::-webkit-scrollbar-thumb{background:var(--border-subtle)}*:hover::-webkit-scrollbar-thumb:hover{background:var(--border-strong)}
:focus-visible,.fv{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-1)}
.tr:focus-visible,.tr.fv,.lrow:focus-visible,.lrow.fv,.irow:focus-visible,.ci:focus-visible,.ci.fv,.res:focus-visible,.rel:focus-visible,.rel.fv{outline-offset:-2px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--font-family-reading)}
.grow{flex:1 1 auto;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{display:block;flex:none}
.g{display:block;flex:none}
.k-source{color:var(--object-source)}.k-note{color:var(--object-note)}.k-topic{color:var(--object-topic)}.k-question{color:var(--object-question)}.k-entity{color:var(--object-entity)}
.s-supports{color:var(--stance-supports)}.s-contradicts{color:var(--stance-contradicts)}.s-extends{color:var(--stance-extends)}.s-depends{color:var(--stance-depends-on)}.s-example{color:var(--stance-example-of)}.s-related{color:var(--stance-related)}
.t1{color:var(--text-primary)}.t2{color:var(--text-secondary)}.t3{color:var(--text-tertiary)}
.cap{font-size:var(--type-caption);line-height:20px}
.sm{font-size:var(--type-small)}
.b5{font-weight:var(--weight-semibold)}
.lnk{color:var(--accent);font-weight:var(--weight-medium)}
.lnk:hover{color:var(--accent-hover);text-decoration:underline;text-underline-offset:3px}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pretty{text-wrap:pretty}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 4px;border:1px solid var(--border-subtle);border-bottom-color:var(--border-strong);border-radius:var(--radius-1);background:var(--surface-soft);color:var(--text-secondary);font:500 var(--type-caption)/1 var(--font-family-ui);font-variant-numeric:tabular-nums;white-space:nowrap}
mark{background:var(--surface-selected);color:inherit;border-radius:2px;padding:0 2px;box-shadow:inset 0 -1px 0 var(--accent)}
/* Meta lines: items separated by "·"; a separator never ends or starts a line (it is clipped at line start). */
.mx{display:block;overflow:hidden;text-wrap:pretty}
.mxi{display:flex;flex-wrap:wrap;align-items:baseline;margin-left:-16px}
.mi{position:relative;margin-left:16px;min-width:0}
.mi::before{content:"·";position:absolute;left:-10px;color:var(--text-tertiary)}

/* Buttons */
.btn{height:32px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--radius-2);background:var(--surface-raised);color:var(--text-primary);font-size:var(--type-small);font-weight:var(--weight-medium);white-space:nowrap;transition:background var(--motion-fast) var(--ease-out)}
.btn:hover{background:var(--surface-hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--text-on-solid)}
.btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.pri kbd{background:transparent;border-color:var(--text-on-solid);color:var(--text-on-solid)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--text-secondary)}
.btn.quiet:hover{background:var(--surface-hover);color:var(--text-primary)}
.btn.link{border-color:transparent;background:transparent;color:var(--accent);padding:0 8px}
.btn.link:hover{background:var(--surface-hover)}
.btn.s{height:28px;padding:0 8px;gap:4px}
.ib{width:28px;height:28px;flex:none;border-radius:var(--radius-2);display:inline-flex;align-items:center;justify-content:center;color:var(--text-secondary)}
.ib:hover{background:var(--surface-hover);color:var(--text-primary)}
.split{height:32px;display:inline-flex;align-items:stretch;border:1px solid var(--border-strong);border-radius:var(--radius-2);background:var(--surface-raised);font-size:var(--type-small);font-weight:var(--weight-medium);white-space:nowrap}
.split>button{display:inline-flex;align-items:center;gap:8px;padding:0 12px;border-radius:var(--radius-2) 0 0 var(--radius-2)}
.split>button:hover{background:var(--surface-hover)}
.split>button.chev{width:28px;padding:0;justify-content:center;border-left:1px solid var(--border-subtle);border-radius:0 var(--radius-2) var(--radius-2) 0;color:var(--text-secondary)}
.split>button[aria-expanded=true]{background:var(--surface-selected);color:var(--accent)}
.seg{display:inline-flex;padding:2px;border-radius:var(--radius-3);background:var(--surface-soft);border:1px solid var(--border-subtle)}
.seg button{height:28px;padding:0 12px;border-radius:var(--radius-2);font-size:var(--type-small);color:var(--text-secondary);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--surface-raised);color:var(--text-primary);font-weight:var(--weight-semibold);box-shadow:0 0 0 1px var(--border-strong)}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:10px;border:1px solid var(--border-subtle);font-size:var(--type-caption);line-height:1;color:var(--text-secondary);white-space:nowrap;background:var(--surface-raised);flex:none}
.tag.new{border-color:var(--accent);color:var(--accent)}
.tag.prov{border:1px dashed var(--border-strong);color:var(--text-secondary);background:transparent}
.st{display:inline-flex;align-items:center;gap:4px;font-size:var(--type-caption);line-height:20px;white-space:nowrap}
.st.ok{color:var(--state-success)}.st.warn{color:var(--state-warning)}.st.err{color:var(--state-danger)}.st.run{color:var(--text-primary)}.st.idle{color:var(--text-tertiary)}
.st .w{color:var(--text-primary)}
.field{height:32px;display:flex;align-items:center;gap:8px;padding:0 4px 0 8px;border:1px solid var(--border-strong);border-radius:var(--radius-2);background:var(--surface-raised);color:var(--text-tertiary);font-size:var(--type-small)}
.field .ph{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{width:12px;height:12px;flex:none;border-radius:50%;border:2px solid var(--surface-selected);border-top-color:var(--accent);border-right-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{height:12px;border-radius:var(--radius-1);background:linear-gradient(90deg,var(--surface-soft),var(--surface-hover),var(--surface-soft));background-size:200% 100%;animation:shimmer 1.4s var(--ease-in-out) infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.caret{display:inline-block;width:2px;height:1.1em;margin-left:2px;vertical-align:-2px;background:var(--accent);animation:blink 1s steps(2) 1.5s infinite}
@keyframes blink{50%{opacity:0}}
.risk{display:inline-flex;align-items:center;gap:4px;font-size:var(--type-caption);font-weight:var(--weight-semibold);white-space:nowrap}
.risk.hi{color:var(--state-danger)}.risk.md{color:var(--state-warning)}.risk.lo{color:var(--text-secondary)}.risk.bl{color:var(--state-warning)}
.newdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}

/* ============================================================================================ SHELL */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);grid-template-rows:var(--top-h) minmax(0,1fr);height:100vh}
.rail{grid-row:1/3;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 0 12px;border-right:1px solid var(--border-subtle);background:var(--surface-canvas)}
.mark{height:var(--top-h);display:flex;align-items:center;justify-content:center;flex:none}
.mark span{width:32px;height:32px;border-radius:var(--radius-3);background:var(--accent);color:var(--text-on-solid);font:600 18px/32px var(--font-family-reading);text-align:center}
.ri{position:relative;width:60px;padding:8px 0;border-radius:var(--radius-3);display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-secondary);font-size:var(--type-caption);line-height:16px;font-weight:var(--weight-medium)}
.ri:hover{background:var(--surface-hover);color:var(--text-primary)}
.ri[aria-current=page]{background:var(--surface-selected);color:var(--accent);font-weight:var(--weight-semibold)}
.ri[aria-current=page]::before{content:"";position:absolute;left:-6px;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--accent)}
.ri .badge{position:absolute;top:4px;left:32px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--state-warning);color:var(--surface-raised);font-size:var(--type-caption);line-height:20px;font-weight:var(--weight-bold);text-align:center;box-shadow:0 0 0 2px var(--surface-canvas)}
.rail .fill{flex:1}
.top{grid-column:2;display:grid;grid-template-columns:calc(var(--nav-w) - var(--top-pl) - var(--top-gap)) minmax(200px,480px) minmax(0,1fr) auto;align-items:center;column-gap:var(--top-gap);padding:0 16px 0 var(--top-pl);border-bottom:1px solid var(--border-subtle);background:var(--surface-canvas);min-width:0}
.top h1{font-size:var(--type-body);font-weight:var(--weight-semibold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.omni{width:100%;height:32px;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;border:1px solid var(--border-subtle);border-radius:var(--radius-3);background:var(--surface-raised);color:var(--text-tertiary);font-size:var(--type-small)}
.omni:hover{border-color:var(--border-strong)}
.omni .ph{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot{justify-self:end;min-width:0;max-width:560px;display:flex}
.pill{height:32px;min-width:0;max-width:100%;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border-radius:16px;border:1px solid var(--border-subtle);background:var(--surface-raised);font-size:var(--type-small);color:var(--text-secondary);white-space:nowrap;overflow:hidden}
.pill:hover{border-color:var(--border-strong)}
.pill b{color:var(--text-primary);font-weight:var(--weight-semibold)}
.pill .tx{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pill .need{display:inline-flex;align-items:center;gap:4px;color:var(--state-warning);font-weight:var(--weight-semibold);flex:none}
.pill .sep{width:1px;height:16px;background:var(--border-subtle);flex:none}
.pill[aria-expanded=true]{background:var(--surface-selected);border-color:var(--accent)}
.pill.toast{border-color:var(--accent);color:var(--text-primary)}
.pill.toast .msg{display:inline-flex;align-items:center;gap:8px;min-width:0}
.pill.toast .lnk{display:inline-flex;align-items:center;gap:4px;flex:none}
.main{grid-column:2;grid-row:2;min-height:0;min-width:0;position:relative;overflow:hidden}

/* Workspace: navigator | stack | context */
.ws{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr) var(--ctx-w);height:100%}
.ws.focus{grid-template-columns:minmax(0,1fr)}
.nav{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border-subtle);background:var(--surface-canvas)}
.nav-scroll{flex:1;overflow:auto;scrollbar-gutter:stable;padding:12px 0 16px 12px}
.nh{display:flex;align-items:baseline;justify-content:space-between;margin:16px 4px 4px 8px;font-size:var(--type-caption);font-weight:var(--weight-semibold);color:var(--text-secondary)}
.nh .c{font-weight:var(--weight-regular);color:var(--text-tertiary)}
.nlegend{margin:-4px 4px 4px 8px;font-size:var(--type-caption);line-height:16px;color:var(--text-tertiary)}
.nlegend b{color:var(--accent);font-weight:var(--weight-semibold)}
.tr{position:relative;width:100%;min-height:var(--row-h);display:flex;align-items:center;gap:8px;padding:0 8px 0 calc(8px + var(--d,0) * var(--ind));border-radius:var(--radius-2);font-size:var(--type-small);color:var(--text-primary);white-space:nowrap}
.tr:hover{background:var(--surface-hover)}
.tr .chev{width:16px;height:16px;flex:none;color:var(--text-tertiary);margin-right:-4px}
.tr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;line-height:20px}
.tr .nm.mid{text-overflow:clip}
.tr .ct{font-size:var(--type-caption);color:var(--text-tertiary);font-variant-numeric:tabular-nums;flex:none}
.tr .plus{font-size:var(--type-caption);color:var(--accent);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums;flex:none}
.tr.anc .nm{font-weight:var(--weight-semibold)}
.tr.cur{background:var(--surface-selected)}
.tr.cur .nm{font-weight:var(--weight-semibold)}
.tr.cur::before{content:"";position:absolute;left:-8px;top:4px;bottom:4px;width:2px;border-radius:2px;background:var(--accent)}
.tr.more .nm{color:var(--text-tertiary)}
.tr .warn{color:var(--state-warning);flex:none}
.tr.tent{flex-wrap:wrap;align-items:flex-start;padding-top:4px;padding-bottom:4px;white-space:normal;row-gap:0}
.tr.tent .chev,.tr.tent .g{margin-top:2px}
.tr.tent .nm{font-style:italic;text-decoration:underline dashed var(--border-strong) 1px;text-underline-offset:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal}
.tr.tent .tag.prov{flex-basis:auto;margin-left:44px;height:18px;margin-top:2px}
.tr.tent .tag.prov::before{content:"";flex-basis:100%}
.tr.tent .brk{flex-basis:100%;height:0}
.tr.drop-plus .plus,.tr.drop-plus .tag.new{display:none}
.tr.drop-ct .ct{display:none}
.tr.wrap{align-items:flex-start;padding-top:4px;padding-bottom:4px;white-space:normal}
.tr.wrap .chev,.tr.wrap .g{margin-top:2px}
.tr.wrap .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal}
.tr.wrap .tag{margin-top:0}
.tr.wrap.cur::before{top:6px;bottom:6px}
.nav-foot{border-top:1px solid var(--border-subtle);padding:8px 8px 8px 12px}
.hoist{position:sticky;top:-12px;z-index:2;margin:0 -8px 4px -12px;padding:8px 8px 8px 12px;background:var(--surface-canvas);border-bottom:1px solid var(--border-subtle)}
.hoist .hb{display:flex;align-items:center;gap:4px;font-size:var(--type-caption);line-height:20px;color:var(--text-secondary);flex-wrap:wrap}
.hoist .hb .nw{white-space:nowrap}
.hoist .hb a:hover{color:var(--accent);text-decoration:underline}
.hoist .ht{display:flex;align-items:center;gap:8px;font-size:var(--type-small);font-weight:var(--weight-semibold)}

/* Stack */
.stack{display:flex;min-width:0;min-height:0;background:var(--surface-canvas);container-type:inline-size;container-name:stack}
.spine{flex:0 0 var(--spine-w);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;border-right:1px solid var(--border-subtle);background:var(--surface-canvas);overflow:hidden;color:var(--text-primary)}
.spine.fwd{border-right:0;border-left:1px solid var(--border-subtle)}
.spine:hover{background:var(--surface-hover)}
.spine .vt{writing-mode:vertical-rl;flex:1;min-height:0;font-size:var(--type-small);line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spine .vt .kw2{color:var(--text-tertiary)}
.spine .more{font-size:var(--type-caption);font-weight:var(--weight-semibold);color:var(--text-primary)}
.panel{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface-raised);border-right:1px solid var(--border-subtle)}
.panel.prev{flex:0 0 var(--prev-w)}
.panel.topp{flex:1 1 0;position:relative;z-index:1;box-shadow:var(--shadow-sheet)}
.spine.prevspine{display:flex}
.panel.prev{display:none}
@container stack (min-width: 848px){.spine.prevspine{display:none}.panel.prev{display:flex}}
.phd{height:40px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 12px;border-bottom:1px solid var(--border-subtle)}
.kind{display:inline-flex;align-items:center;gap:8px;font-size:var(--type-small);font-weight:var(--weight-medium);color:var(--text-secondary);margin-right:4px;white-space:nowrap}
.prev .phd{background:var(--surface-raised)}
.pb{flex:1;overflow:auto;padding:20px 24px 48px}
.prev .pb{padding:16px 16px 32px}
.prev .ttl{font-size:var(--type-lead);line-height:1.4}
.prev .rib{font-size:var(--type-caption)}
.focus-on{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:var(--radius-2);background:var(--surface-selected);color:var(--text-primary);font-size:var(--type-small);font-weight:var(--weight-medium);box-shadow:inset 0 0 0 1px var(--accent)}
.banner .grow{flex:1 1 200px}
.banner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;margin:0 0 16px;border-radius:var(--radius-3);background:var(--surface-soft);font-size:var(--type-small);color:var(--text-secondary)}

/* Path ribbon */
.rib{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px;margin:0 0 8px;font-size:var(--type-small);line-height:20px;color:var(--text-secondary)}
.rib a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.rib .sep{color:var(--text-tertiary)}
.rib .leaf{color:var(--text-primary);font-weight:var(--weight-semibold)}
.rib .g{margin-right:4px}
.rib .tent{display:inline-flex;flex-wrap:wrap;gap:0 4px;border-bottom:1px dashed var(--border-strong)}
.rib .pre{color:var(--text-tertiary)}
.rib .aft::before{content:'· '}
.rib .aft.nl::before{content:none}
.also{margin:-8px 0 8px;font-size:var(--type-caption);line-height:20px;color:var(--text-tertiary)}
.also a{color:var(--text-secondary)}
.also a:hover{color:var(--accent);text-decoration:underline}

/* Object page */
.ttl{margin:0 0 8px;font:var(--weight-semibold) var(--type-title)/1.35 var(--font-family-reading);text-wrap:balance;color:var(--text-primary)}
.ttl.lg{font-size:var(--type-display);line-height:1.3}
.meta{margin:0 0 16px;font-size:var(--type-small);line-height:20px;color:var(--text-secondary)}
.prose{font:400 var(--type-reading)/1.75 var(--font-family-reading);max-width:var(--measure);color:var(--text-primary);text-wrap:pretty}
.prose p{margin:0 0 16px}
.prose.sm{font-size:var(--type-body);line-height:1.6;color:var(--text-secondary)}
.fn{font:var(--weight-semibold) var(--type-caption)/0 var(--font-family-ui);color:var(--accent);vertical-align:super;padding:0 2px}
.sh{display:flex;align-items:baseline;gap:8px;margin:32px 0 8px;font-size:var(--type-small);font-weight:var(--weight-semibold);color:var(--text-primary);white-space:nowrap}
.sh .c{white-space:normal;min-width:0;flex:0 1 auto}
.sh .c{font-weight:var(--weight-regular);color:var(--text-tertiary)}
.sh .r{margin-left:auto}
.hint{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;margin:0 0 8px;border-radius:var(--radius-2);background:var(--surface-soft);font-size:var(--type-caption);line-height:20px;color:var(--text-secondary)}
.hint .ic{margin-top:2px}
.ev{display:grid;grid-template-columns:20px minmax(0,1fr);gap:0 4px;margin:0 0 16px}
.ev .n{font:var(--weight-semibold) var(--type-caption)/24px var(--font-family-ui);color:var(--text-secondary)}
.ev q{font:italic 400 var(--type-body)/1.6 var(--font-family-reading);color:var(--text-primary)}
.ev .src{grid-column:2;display:flex;align-items:center;gap:4px;margin-top:4px;font-size:var(--type-caption);color:var(--text-secondary)}
.rows>li{border-top:1px solid var(--border-subtle)}
.lrow{display:flex;gap:8px;align-items:flex-start;padding:8px;margin:0 -8px;border-radius:var(--radius-2);width:calc(100% + 16px)}
.lrow:hover{background:var(--surface-hover)}
.lrow .g{margin-top:2px}
.lrow .t{font-size:var(--type-small);line-height:20px;color:var(--text-primary)}
.lrow .m{font-size:var(--type-caption);line-height:20px;color:var(--text-tertiary)}
.lrow.cur{background:var(--surface-selected);box-shadow:inset 2px 0 0 var(--accent)}
.lrow.cur .t{font-weight:var(--weight-semibold)}
.path{display:inline-flex;flex-wrap:wrap;align-items:center;gap:0 4px;font-size:var(--type-caption);line-height:20px;color:var(--text-secondary)}
.path .sep{color:var(--text-tertiary)}
.path .g{margin-right:0}
.path.tentp{border-bottom:1px dashed var(--border-strong)}
.path.blk{display:flex}
.blk{display:block}

/* Connections */
.stw{display:inline-flex;align-items:center;gap:8px;font-size:var(--type-small);font-weight:var(--weight-semibold);white-space:nowrap}
.rel{display:grid;grid-template-columns:168px minmax(0,1fr) auto;gap:0 12px;align-items:start;padding:12px 8px;margin:0 -8px;border-top:1px solid var(--border-subtle);border-radius:0}
.rel:hover,.rel.hov{background:var(--surface-hover)}
.rel .t{font-size:var(--type-body);line-height:20px}
.rel .who{font-size:var(--type-caption);line-height:20px;color:var(--text-secondary);text-align:right;white-space:nowrap}
.rel.sug{border:1px dashed var(--border-strong);border-radius:var(--radius-3);margin:12px -8px 0}
.sugact{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.relsum{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px}
.relsum .chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border:1px solid var(--border-subtle);border-radius:var(--radius-2);font-size:var(--type-small);background:var(--surface-raised)}
.relsum .chip.sg{border-style:dashed;border-color:var(--border-strong)}

/* Context panel */
.ctx{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--border-subtle);background:var(--surface-canvas)}
.ctabs{height:40px;flex:none;display:flex;align-items:stretch;padding:0 4px 0 8px;border-bottom:1px solid var(--border-subtle);gap:0}
.ctab{padding:0 6px;display:flex;align-items:center;gap:4px;font-size:var(--type-small);color:var(--text-secondary);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.ctab:hover{color:var(--text-primary);background:var(--surface-hover)}
.ctab[aria-selected=true]{color:var(--text-primary);font-weight:var(--weight-semibold);border-bottom-color:var(--accent)}
.ctab.morebtn{margin-left:auto;color:var(--text-secondary)}
.ctx-body{flex:1;overflow:auto;padding:16px 16px 32px}
.ctx-h{display:flex;flex-direction:column;gap:0;margin:0 0 12px}
.ctx-h h2{font-size:var(--type-body);font-weight:var(--weight-semibold)}
.ctx-h .c{font-size:var(--type-caption);line-height:16px;color:var(--text-tertiary);text-wrap:pretty}
.cg{margin:0 0 16px}
.cgh{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:var(--type-small);font-weight:var(--weight-semibold)}
.cgh .c{font-weight:var(--weight-regular);color:var(--text-tertiary);font-size:var(--type-caption)}
.ci{display:block;width:calc(100% + 16px);padding:8px;margin:0 -8px;border-radius:var(--radius-2)}
.ci:hover{background:var(--surface-hover)}
.ci .t{font-size:var(--type-small);line-height:20px;color:var(--text-primary)}
.ci .m{font-size:var(--type-caption);line-height:20px;color:var(--text-tertiary)}
.ci .path{display:flex}
.sugbox{border:1px dashed var(--border-strong);border-radius:var(--radius-3);padding:8px 12px 12px;margin:0 0 16px}
.ctx-foot{display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--border-subtle)}
.ctx-strip{display:none}
.askbox{border:1px solid var(--border-strong);border-radius:var(--radius-3);background:var(--surface-raised);padding:8px 8px 8px 12px;display:flex;align-items:center;gap:8px;font-size:var(--type-small);color:var(--text-tertiary);min-height:40px}
.sugq{display:block;width:100%;text-align:left;padding:8px;border-radius:var(--radius-2);font-size:var(--type-small);line-height:20px;color:var(--text-primary)}
.sugq:hover{background:var(--surface-hover)}

/* Thread (one grammar everywhere the system acts) */
.thread>li{position:relative;padding:0 0 16px 24px}
.thread>li::before{content:"";position:absolute;left:7px;top:14px;bottom:-2px;width:1px;background:var(--thread)}
.thread>li:last-child::before{display:none}
.nd{position:absolute;left:3px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--text-tertiary)}
.nd.run{background:var(--surface-raised);border:2px solid var(--accent);box-shadow:0 0 0 3px var(--surface-selected)}
.nd.wait{background:var(--surface-raised);border:1.5px solid var(--border-strong)}
.nd.need{background:var(--state-warning)}
.nd.new{background:var(--accent)}
.th-row{display:flex;gap:12px;align-items:baseline}
.th-t{font-size:var(--type-small);line-height:20px;color:var(--text-primary);text-wrap:pretty}
.th-t .g{display:inline-block;vertical-align:-3px;margin:0 2px}
.th-m{font-size:var(--type-caption);line-height:20px;color:var(--text-tertiary)}
.th-r{margin-left:auto;text-align:right;white-space:nowrap;font-size:var(--type-caption);line-height:20px;color:var(--text-tertiary);display:flex;flex-direction:column;align-items:flex-end}
.undo{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:var(--weight-medium);font-size:var(--type-caption)}
.undo:hover{text-decoration:underline}
.bar{height:4px;border-radius:2px;background:var(--surface-hover);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.inl{display:inline-flex;align-items:center;gap:4px;vertical-align:bottom}

/* ============================================================================================ HOME */
.scroll{height:100%;overflow:auto}
.home-in{max-width:1136px;margin:0 auto;padding:32px 48px 48px}
.brief{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:48px;align-items:start;padding-bottom:20px}
.date{font-size:var(--type-small);color:var(--text-tertiary);margin:0 0 8px}
.greet{font:var(--weight-semibold) var(--type-display)/1.3 var(--font-family-reading);margin:0 0 8px}
.bp{font:400 var(--type-lead)/1.6 var(--font-family-reading);margin:0 0 12px;max-width:36em;text-wrap:pretty}
.bp a{color:var(--accent);font-weight:var(--weight-semibold);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.calm{display:flex;gap:8px;align-items:center;font-size:var(--type-small);color:var(--text-secondary)}
.calm .ic{color:var(--state-success)}
.resume{border:1px solid var(--border-subtle);border-radius:var(--radius-4);background:var(--surface-raised);box-shadow:var(--shadow-sheet);padding:16px}
.resume-h{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--type-small)}
.resume-h b{font-weight:var(--weight-semibold)}
.trail{margin:12px 0}
.trail li{position:relative;display:flex;gap:8px;align-items:flex-start;padding:4px 0 4px 20px;font-size:var(--type-small);line-height:20px}
.trail li::before{content:"";position:absolute;left:5px;top:16px;bottom:-8px;width:1px;background:var(--thread)}
.trail li:last-child::before{display:none}
.trail li .nd{left:1px;top:10px}
.trail li .k{color:var(--text-tertiary);flex:none;width:64px}
.trail li .t{font-family:var(--font-family-reading);font-weight:var(--weight-semibold);min-width:0}
.trail li.now .t{color:var(--text-primary)}
.resume-f{display:flex;align-items:center;justify-content:space-between;font-size:var(--type-small);color:var(--text-secondary)}
.shape{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:12px 0 16px;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle)}
.shape .lbl{font-size:var(--type-small);font-weight:var(--weight-semibold)}
.sbar{grid-column:1/-1;display:flex;gap:2px;min-height:40px;min-width:0}
.sbar a{flex:var(--n) 1 0;min-width:0;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:var(--radius-1);background:var(--surface-soft);border:1px solid var(--border-subtle);font-size:var(--type-caption);line-height:16px;overflow:hidden}
.sbar a:hover{background:var(--surface-hover)}
.sbar a .v{color:var(--text-tertiary);white-space:nowrap}
.sbar a.big{border-color:var(--state-warning)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"need gard arr" "need gard back";gap:8px 40px;padding-top:20px;align-items:start}
.a-need{grid-area:need}.a-gard{grid-area:gard}.a-arr{grid-area:arr}.a-back{grid-area:back;padding-top:16px}
.colh{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;margin:0 0 8px;font-size:var(--type-body);font-weight:var(--weight-semibold)}
.colh .c{font-size:var(--type-caption);font-weight:var(--weight-regular);color:var(--text-tertiary)}
.colh .r{margin-left:auto;font-size:var(--type-caption)}
.colh .sub{flex-basis:100%;line-height:16px}
.needrow{display:grid;grid-template-columns:88px minmax(0,1fr);gap:0 8px;padding:12px 0;border-top:1px solid var(--border-subtle);width:100%}
.needrow:hover .t{color:var(--accent)}
.needrow .t{font-size:var(--type-small);line-height:20px;font-weight:var(--weight-medium)}
.needrow .m{grid-column:2;font-size:var(--type-caption);line-height:20px;color:var(--text-tertiary)}
.arrow-row{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:0 8px;padding:12px 0;border-top:1px solid var(--border-subtle);align-items:start}
.arrow-row .t{font-size:var(--type-small);line-height:20px;font-weight:var(--weight-medium)}
.arrow-row .n{font-size:var(--type-small);font-weight:var(--weight-semibold);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.arrow-row .n span{display:block;font-size:var(--type-caption);font-weight:var(--weight-regular);color:var(--text-tertiary)}
.back-note{padding:12px 0;border-top:1px solid var(--border-subtle)}
.back-note .t{font:var(--weight-semibold) var(--type-body)/1.45 var(--font-family-reading)}
.back-note .why{font-size:var(--type-caption);line-height:20px;color:var(--text-secondary);margin:4px 0}

/* ============================================================================================ LIBRARY */
.dest-h{display:flex;align-items:center;gap:16px;padding:20px 32px 12px}
.dest-h h2{font:var(--weight-semibold) var(--type-title)/1.35 var(--font-family-reading)}
.dest-h .c{font-size:var(--type-small);color:var(--text-tertiary)}
.lib{display:flex;flex-direction:column;height:100%}
.lib-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:0 32px 12px}
.terr{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:0 32px 12px;font-size:var(--type-caption);color:var(--text-tertiary)}
.terr button{height:24px;padding:0 8px;border-radius:12px;display:inline-flex;align-items:center;gap:4px;color:var(--text-secondary);font-size:var(--type-caption)}
.terr button:hover{background:var(--surface-hover)}
.terr button b{font-weight:var(--weight-semibold);color:var(--text-primary);font-variant-numeric:tabular-nums}
.tbl-wrap{flex:1;overflow:auto;scrollbar-gutter:stable;margin:0 16px;border-top:1px solid var(--border-subtle)}
table{border-collapse:collapse;width:100%}
.tbl th{position:sticky;top:0;z-index:1;background:var(--surface-canvas);text-align:left;font-size:var(--type-caption);font-weight:var(--weight-semibold);color:var(--text-secondary);padding:0;border-bottom:1px solid var(--border-subtle);white-space:nowrap}
.tbl th button{display:flex;align-items:center;gap:4px;width:100%;padding:8px 16px;color:inherit;font-weight:inherit}
.tbl th button:hover{background:var(--surface-hover)}
.tbl th[aria-sort] button{color:var(--text-primary)}
.tbl th.r button{justify-content:flex-end}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--border-subtle);vertical-align:top;font-size:var(--type-small)}
.tbl tr:hover td{background:var(--surface-hover)}
.tbl tr.sel td{background:var(--surface-selected)}
.tbl tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .tt{display:flex;gap:8px;align-items:flex-start}
.tbl .tt .g{margin-top:2px}
.tbl .t1{font-weight:var(--weight-medium);color:var(--text-primary);line-height:20px}
.tbl .t2{font-size:var(--type-caption);line-height:20px;color:var(--text-tertiary)}
.lib-foot{display:flex;gap:16px;align-items:center;padding:8px 32px;border-top:1px solid var(--border-subtle);font-size:var(--type-caption);color:var(--text-secondary)}
.lib-foot span{display:inline-flex;align-items:center;gap:4px}

/* ============================================================================================ INBOX */
.ibx{display:grid;grid-template-columns:360px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 40px;height:100%}
.ibx-list{border-right:1px solid var(--border-subtle);overflow:auto;scrollbar-gutter:stable;padding:20px 8px 24px 24px}
.ibx-list h2{font:var(--weight-semibold) var(--type-title)/1.35 var(--font-family-reading)}
.ibx-g{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;margin:20px 0 4px 8px}
.ibx-g .c{font-size:var(--type-caption);color:var(--text-tertiary)}
.irow{display:block;width:100%;padding:12px;border-radius:var(--radius-3);border:1px solid transparent}
.irow:hover{background:var(--surface-hover)}
.irow.sel{background:var(--surface-raised);border-color:var(--border-subtle);box-shadow:var(--shadow-sheet),inset 2px 0 0 var(--accent)}
.irow .t{font-size:var(--type-small);line-height:20px;font-weight:var(--weight-medium);display:flex;gap:8px}
.irow .t .k{margin-left:auto;font-size:var(--type-caption);font-weight:var(--weight-regular);color:var(--text-tertiary)}
.irow .sub{display:block;font-size:var(--type-caption);line-height:20px;color:var(--text-secondary)}
.irow .m{display:block;font-size:var(--type-caption);line-height:20px;color:var(--text-tertiary)}
.irow.done{border:1px solid var(--border-subtle)}
.ibx-empty{border:1.5px dashed var(--border-strong);border-radius:var(--radius-3);padding:12px;font-size:var(--type-caption);line-height:20px;color:var(--text-secondary)}
.ibx-d{display:flex;flex-direction:column;min-height:0;background:var(--surface-raised)}
.ibx-scroll{flex:1;overflow:auto;padding:24px 40px 24px}
.ibx-d .reason{font:400 var(--type-reading)/1.7 var(--font-family-reading);max-width:40em;margin:0 0 24px;text-wrap:pretty}
.ibx-d .subt{font:400 var(--type-lead)/1.4 var(--font-family-reading);color:var(--text-secondary);margin:-4px 0 12px}
.diff{margin:0 0 8px}
.drow{margin-bottom:12px}
.drow .lb{display:block;font-size:var(--type-caption);font-weight:var(--weight-semibold);color:var(--text-secondary);margin:0 0 4px}
.lane{position:relative;height:32px;margin-bottom:4px}
.cell{position:absolute;top:0;bottom:0;padding-right:2px}
.cell>div{height:100%;border-radius:var(--radius-1);background:var(--surface-soft);border:1px solid var(--border-subtle);display:flex;align-items:center;gap:4px;padding:0 8px;font-size:var(--type-caption);color:var(--text-primary);white-space:nowrap;overflow:hidden}
.cell .v{color:var(--text-tertiary);font-variant-numeric:tabular-nums}
.cell .key{display:none;width:16px;height:16px;border-radius:50%;border:1px solid var(--border-strong);font-size:11px;line-height:14px;text-align:center;font-weight:var(--weight-semibold);color:var(--text-primary);flex:none;margin:0 auto;font-size:var(--type-caption);line-height:14px}
.cell.new>div{background:var(--surface-selected);border:1.5px solid var(--accent)}
.cell.new .nw{font-weight:var(--weight-bold);color:var(--accent)}
.cell.out>div{background:repeating-linear-gradient(135deg,var(--border-strong) 0 1px,var(--surface-raised) 1px 5px);border:1.5px dashed var(--border-strong)}
.cell.out .key{background:var(--surface-raised)}
.cell.blank>div{background:none;border:0}
.cell.root>div{background:var(--surface-hover);font-weight:var(--weight-semibold)}
.cell.direct>div{background:transparent;border:1px dashed var(--border-strong)}
.cell.nocount .v{display:none}
.cell.keyed>div{padding:0}.cell.keyed>div>*{display:none}.cell.keyed>div>.key{display:block}
.cell.tiny>div>*{display:none}
.lanekey{display:flex;flex-wrap:wrap;gap:4px 16px;margin:4px 0 0;font-size:var(--type-caption);line-height:20px;color:var(--text-secondary)}
.lanekey span{display:inline-flex;align-items:center;gap:4px}
.lanekey .key{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid var(--border-strong);font-size:var(--type-caption);line-height:14px;text-align:center;font-weight:var(--weight-semibold);color:var(--text-primary)}
.callout{position:absolute;top:0;font-size:var(--type-caption);line-height:16px;color:var(--text-primary);font-weight:var(--weight-semibold);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;font-size:var(--type-caption);color:var(--text-secondary);margin:0 0 24px}
.legend i{display:inline-block;width:16px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px;border:1px solid var(--border-subtle);background:var(--surface-soft)}
.legend i.new{background:var(--surface-selected);border:1.5px solid var(--accent)}
.legend i.out{background:repeating-linear-gradient(135deg,var(--border-strong) 0 1px,var(--surface-raised) 1px 4px);border:1.5px dashed var(--border-strong)}
.legend i.direct{background:transparent;border:1px dashed var(--border-strong)}
.impact{display:flex;flex-wrap:wrap;gap:16px 40px;padding:16px 0;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);margin:0 0 24px}
.impact b{display:block;font:var(--weight-semibold) var(--type-title)/1.35 var(--font-family-ui);font-variant-numeric:tabular-nums}
.impact span{font-size:var(--type-caption);color:var(--text-secondary)}
.ibx-act{flex:none;display:flex;align-items:center;gap:8px;padding:12px 40px;border-top:1px solid var(--border-subtle);background:var(--surface-raised)}
.ibx-act .note{font-size:var(--type-caption);line-height:16px;color:var(--text-secondary);margin-left:8px;max-width:340px}
.verbs{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 16px;padding:12px 40px 16px;border-top:1px solid var(--border-subtle);background:var(--surface-raised)}
.verbs .v{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.verbs .v p{font-size:var(--type-caption);line-height:16px;color:var(--text-secondary);text-wrap:pretty}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:stretch;margin:0 0 24px}
.pcard{border:1px solid var(--border-subtle);border-radius:var(--radius-3);padding:12px 16px;background:var(--surface-raised)}
.pcard .t{font:var(--weight-semibold) var(--type-body)/1.45 var(--font-family-reading);margin:4px 0}
.pcard q{display:block;font:italic 400 var(--type-small)/1.6 var(--font-family-reading);color:var(--text-primary);margin:8px 0 4px}
.pmid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:var(--type-caption);font-weight:var(--weight-semibold)}
.keybar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 24px;border-top:1px solid var(--border-subtle);background:var(--surface-canvas);font-size:var(--type-caption);color:var(--text-secondary);white-space:nowrap;overflow:hidden}
.keybar span{display:inline-flex;align-items:center;gap:4px}
.keybar .rule{margin-left:auto;color:var(--text-tertiary)}
.what{width:100%;margin:8px 0 0}
.what th{font-size:var(--type-caption);text-align:left;color:var(--text-secondary);font-weight:var(--weight-semibold);padding:8px 12px 8px 0;border-bottom:1px solid var(--border-subtle)}
.what td{font-size:var(--type-small);padding:8px 12px 8px 0;border-bottom:1px solid var(--border-subtle);vertical-align:top}

/* ============================================================================================ MAP */
.map{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto auto minmax(0,1fr);height:100%}
.map-h{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:12px 32px;border-bottom:1px solid var(--border-subtle)}
.map-h h2{font:var(--weight-semibold) var(--type-title)/1.35 var(--font-family-reading)}
.zoomout{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:8px 32px;background:var(--surface-selected);font-size:var(--type-small);color:var(--text-primary)}
.map-l{overflow:auto;padding:16px 32px 32px}
.map-r{border-left:1px solid var(--border-subtle);overflow:auto;background:var(--surface-raised)}
.map-r .tblh{padding:12px 20px 4px;font-size:var(--type-caption);font-weight:var(--weight-semibold);color:var(--text-secondary)}
.ic-head{display:grid;grid-template-columns:1fr 1.5fr 1.5fr;gap:4px;margin:0 0 4px;font-size:var(--type-caption);color:var(--text-tertiary);font-weight:var(--weight-semibold)}
.ice{height:max(640px,calc(100vh - 220px));display:flex;flex-direction:column;gap:2px}
.icr{display:flex;gap:4px;min-height:0}
.icr>.icc{flex:1 1 0}
.icsub{display:flex;flex-direction:column;gap:2px;min-width:0}
.icsub.l2{flex:3 1 0}.icsub.l3{flex:1 1 0}
.icc{min-width:0;min-height:0;border-radius:var(--radius-1);background:var(--surface-soft);border:1px solid var(--border-subtle);padding:0 8px;display:flex;align-items:center;gap:4px;font-size:var(--type-caption);line-height:16px;overflow:hidden;white-space:nowrap;position:relative}
.icc:hover{background:var(--surface-hover)}
.icc .icn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.icc .v{color:var(--text-tertiary);font-variant-numeric:tabular-nums}
.icc.sel{background:var(--surface-selected);border:2px solid var(--accent)}
.icc.here{box-shadow:inset 3px 0 0 var(--accent)}
.icc .herel{margin-left:auto;font-weight:var(--weight-semibold);color:var(--text-primary)}
.icc .wg{margin-left:auto;color:var(--state-warning)}
.icr.mrg{min-height:16px}
.icc.merged{background:transparent;border:1px dashed var(--border-strong);color:var(--text-secondary)}
.icc.nocount .v{display:none}.icc.nolabel>*{display:none}
.icc.direct{background:transparent;border-style:dashed;border-color:var(--border-strong);color:var(--text-secondary)}
.ic-legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:12px 0 16px;font-size:var(--type-caption);color:var(--text-secondary)}
.selblock{display:flex;flex-direction:column;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border-subtle)}
.selblock h4{font-size:var(--type-caption);font-weight:var(--weight-semibold);color:var(--text-tertiary);margin:0 0 4px}
.selblock p{font-size:var(--type-small);line-height:20px}
.mt{table-layout:fixed}
.mt td,.mt th{padding:8px;font-size:var(--type-caption);line-height:16px;border-bottom:1px solid var(--border-subtle);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt td:last-child,.mt th:last-child{padding-right:16px}
.mt col.cn{width:52px}.mt col.ch{width:124px}.mt col.cw{width:64px}
.mt th{position:sticky;top:0;background:var(--surface-raised);font-weight:var(--weight-semibold);color:var(--text-secondary)}
.mt td.lvl0{font-weight:var(--weight-semibold);font-size:var(--type-small)}
.mt .r{text-align:right;font-variant-numeric:tabular-nums}
.mt tr.sel td{background:var(--surface-selected)}
.mt tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.mt td:first-child,.mt th:first-child{padding-left:20px}.mt .ind1{padding-left:28px!important}.mt .ind2{padding-left:36px!important}.mt .ind3{padding-left:44px!important}
.mt td.here{white-space:normal}
.mt.wrap td{white-space:normal}
.graph{position:relative;border:1px solid var(--border-subtle);border-radius:var(--radius-3);background:var(--surface-raised)}
.graph svg{display:block;width:100%;height:auto}
.graph text{font:500 12px var(--font-family-ui);fill:var(--text-primary);paint-order:stroke;stroke:var(--surface-raised);stroke-width:4px;stroke-linejoin:round}
.graph .lab2{fill:var(--text-secondary);font-weight:400}
.glegend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0 0;font-size:var(--type-caption);color:var(--text-secondary)}
.glegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* ============================================================================================ OVERLAYS */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.cmdk{position:fixed;z-index:21;top:72px;left:50%;transform:translateX(-50%);width:min(800px,calc(100% - 64px));max-height:calc(100vh - 120px);display:flex;flex-direction:column;border-radius:var(--radius-4);background:var(--surface-raised);box-shadow:var(--shadow-pop);overflow:hidden}
.cmdk-in{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-bottom:1px solid var(--border-subtle);font-size:var(--type-lead)}
.cmdk-in .q{flex:1}
.cmdk-pre{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border-subtle);font-size:var(--type-caption);color:var(--text-secondary)}
.pchip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:12px;border:1px solid var(--border-subtle);background:var(--surface-raised);color:var(--text-secondary)}
.pchip b{font-family:var(--font-family-ui);color:var(--text-primary)}
.pchip:hover{border-color:var(--border-strong)}
.cmdk-body{display:grid;grid-template-columns:minmax(0,1fr) 288px;min-height:0;flex:1}
.cmdk-res{overflow:auto;padding:8px}
.cgt{display:flex;justify-content:space-between;align-items:baseline;margin:8px 8px 4px;font-size:var(--type-caption);font-weight:var(--weight-semibold);color:var(--text-secondary)}
.cgt .c{font-weight:var(--weight-regular);color:var(--text-tertiary)}
.cgt .lnk{font-weight:var(--weight-medium)}
.res{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:0 12px;align-items:start;width:100%;padding:8px;border-radius:var(--radius-2)}
.res:hover{background:var(--surface-hover)}
.res.sel{background:var(--surface-selected);box-shadow:inset 2px 0 0 var(--accent)}
.res .t{display:block;font-size:var(--type-body);line-height:20px}
.res u{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;font-weight:var(--weight-semibold)}
.res .m{display:block;font-size:var(--type-caption);line-height:20px;color:var(--text-tertiary)}
.res .x{font-size:var(--type-caption);color:var(--text-tertiary);white-space:nowrap;display:flex;align-items:center;gap:4px}
.res .g{margin-top:2px}
.cmdk-prev{border-left:1px solid var(--border-subtle);background:var(--surface-canvas);padding:16px;overflow:auto}
.cmdk-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px;border-top:1px solid var(--border-subtle);font-size:var(--type-caption);color:var(--text-secondary)}
.cmdk-foot span{display:inline-flex;align-items:center;gap:4px}
.drawer{position:absolute;z-index:15;top:0;right:0;bottom:0;width:400px;display:flex;flex-direction:column;background:var(--surface-raised);border-left:1px solid var(--border-subtle);box-shadow:var(--shadow-pop)}
.drawer-h{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--border-subtle)}
.drawer-h h2{font-size:var(--type-body);font-weight:var(--weight-semibold)}
.drawer-b{flex:1;overflow:auto;padding:16px 20px 32px}
.dsec{margin:0 0 20px}
.dsh{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px;margin:0 0 8px;font-size:var(--type-small);font-weight:var(--weight-semibold);white-space:nowrap}
.dsh .c{font-weight:var(--weight-regular);color:var(--text-tertiary);font-size:var(--type-caption);white-space:normal}
.peek{position:fixed;z-index:21;top:96px;left:50%;transform:translateX(-50%);width:min(640px,calc(100% - 64px));border-radius:var(--radius-4);background:var(--surface-raised);box-shadow:var(--shadow-pop);overflow:hidden}
.peek-h{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 20px;border-bottom:1px solid var(--border-subtle);font-size:var(--type-caption);color:var(--text-secondary)}
.peek-b{padding:20px 24px 24px}
.peek-f{display:flex;gap:16px;padding:8px 20px;border-top:1px solid var(--border-subtle);font-size:var(--type-caption);color:var(--text-secondary)}
.peek-f span{display:inline-flex;gap:4px;align-items:center}
.menu{position:fixed;z-index:21;top:44px;right:16px;width:360px;padding:8px;border-radius:var(--radius-4);background:var(--surface-raised);box-shadow:var(--shadow-pop)}
.menu .mi2{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border-radius:var(--radius-2);font-size:var(--type-small)}
.menu .mi2:hover,.menu .mi2.sel{background:var(--surface-hover)}
.menu .mi2 .grow span{display:block;font-size:var(--type-caption);line-height:16px;color:var(--text-tertiary)}
.menu .mh{margin:8px 8px 4px;font-size:var(--type-caption);font-weight:var(--weight-semibold);color:var(--text-secondary)}
.menu hr{border:0;border-top:1px solid var(--border-subtle);margin:8px 0}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border-strong);flex:none;margin-top:2px;position:relative}
.radio.on{border-color:var(--accent)}.radio.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.sheet{position:fixed;z-index:21;top:64px;left:50%;transform:translateX(-50%);width:min(960px,calc(100% - 64px));max-height:calc(100vh - 96px);overflow:auto;border-radius:var(--radius-4);background:var(--surface-raised);box-shadow:var(--shadow-pop)}
.sheet-h{display:flex;align-items:center;gap:12px;padding:12px 16px 12px 24px;border-bottom:1px solid var(--border-subtle)}
.sheet-h h2{font:var(--weight-semibold) var(--type-title)/1.35 var(--font-family-reading)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 32px;padding:16px 24px 8px}
.keys h3{font-size:var(--type-small);font-weight:var(--weight-semibold);margin:8px 0 4px}
.keys li{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:var(--type-small);line-height:20px;border-top:1px solid var(--border-subtle)}
.keys li .kk{display:inline-flex;gap:2px;flex:none;min-width:84px}
.dropov{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:center;justify-content:center}
.dropov::before{content:"";position:absolute;inset:16px;border:2px dashed var(--accent);border-radius:var(--radius-4)}
.dropcard{position:relative;width:440px;padding:24px;border-radius:var(--radius-4);background:var(--surface-raised);box-shadow:var(--shadow-pop);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

/* ============================================================================================ SOURCE / ASK / PASSAGE */
.gen{border:1px solid var(--border-subtle);border-radius:var(--radius-4);background:var(--surface-canvas);padding:16px;margin:0 0 24px}
.gen-h{display:flex;align-items:flex-start;gap:12px;margin:0 0 16px}
.gen-h .ring{margin-top:4px}
.gen-h b{font-size:var(--type-small);font-weight:var(--weight-semibold)}
.gen-h .m{font-size:var(--type-caption);color:var(--text-secondary);line-height:20px}
.gen.done{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:var(--type-small);color:var(--text-secondary)}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0}
.steps li{position:relative;padding:20px 8px 0 0;font-size:var(--type-caption);line-height:16px}
.steps li::before{content:"";position:absolute;top:5px;left:12px;right:0;height:2px;background:var(--thread)}
.steps li:last-child::before{display:none}
.steps li.done::before{background:var(--text-tertiary)}
.steps li .nd{top:0;left:0}
.steps b{display:block;font-size:var(--type-small);line-height:20px;font-weight:var(--weight-semibold);color:var(--text-primary)}
.steps span{color:var(--text-secondary)}
.steps li.run span{color:var(--text-primary);font-weight:var(--weight-medium)}
.ruler{display:flex;gap:4px;margin:4px 0 0;align-items:flex-start}
.rulercap{margin:16px 0 0;font-size:var(--type-caption);color:var(--text-tertiary)}
.ruler .rl{font-size:var(--type-caption);color:var(--text-tertiary);white-space:nowrap;width:56px;flex:none;line-height:16px}
.ruler .seg2{display:flex;flex-direction:column;gap:4px;min-width:0}
.ruler .seg2 i{display:block;height:8px;border-radius:2px;background:var(--surface-hover);border:1px solid var(--border-subtle)}
.ruler .seg2.d i{background:var(--text-tertiary);border-color:var(--text-tertiary)}
.ruler .seg2.r i{background:repeating-linear-gradient(135deg,var(--accent) 0 2px,var(--surface-selected) 2px 5px);border-color:var(--accent)}
.ruler .seg2 span{font-size:var(--type-caption);line-height:16px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrive>li{border-top:1px solid var(--border-subtle)}
.arrive .lrow{padding:12px 8px}
.arrive .when{font-size:var(--type-caption);line-height:20px;color:var(--text-primary);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.askbar{display:flex;align-items:center;gap:12px;padding:8px 12px;margin:0 0 16px;border-radius:var(--radius-3);background:var(--surface-selected);font-size:var(--type-small);max-width:var(--measure)}
.dots{display:inline-flex;gap:4px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--accent);animation:pulse 1.2s var(--ease-in-out) infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes pulse{50%{opacity:.25}}
.cite{display:inline-flex;align-items:center;gap:2px;height:20px;padding:0 4px;border-radius:var(--radius-1);border:1px solid var(--border-subtle);background:var(--surface-soft);font:var(--weight-semibold) var(--type-caption)/1 var(--font-family-ui);color:var(--text-secondary);vertical-align:2px;cursor:pointer}
.cite:hover,.cite.on{background:var(--surface-selected);border-color:var(--accent);color:var(--accent)}
.follow{display:flex;align-items:center;gap:8px;height:40px;padding:0 4px 0 12px;margin-top:8px;border:1px solid var(--border-strong);border-radius:var(--radius-3);color:var(--text-tertiary);font-size:var(--type-small);max-width:var(--measure)}
.src-i{display:block;width:calc(100% + 16px);margin:0 -8px;padding:8px;border-radius:var(--radius-2);border-left:2px solid transparent}
.src-i .t{display:flex;gap:8px;font-size:var(--type-small);line-height:20px;font-weight:var(--weight-medium)}
.src-i .t .n{font-weight:var(--weight-semibold);color:var(--text-secondary);width:12px;flex:none}
.src-i .m{display:block;padding-left:20px;font-size:var(--type-caption);line-height:20px;color:var(--text-tertiary)}
.src-i .pass{display:none;padding:4px 0 0 20px}
.src-i.on{background:var(--surface-raised);border-left-color:var(--accent);box-shadow:var(--shadow-sheet)}
.src-i.on .pass{display:block}
.src-i .pass q{display:block;font:italic 400 var(--type-small)/1.6 var(--font-family-reading);color:var(--text-primary);margin:0 0 8px}
.inlinesrc{display:none;max-width:var(--measure);margin-top:24px}
.qtray{display:none}
.qwrap{display:flex;flex-direction:column;flex:1;min-height:0}
.psg{max-width:var(--measure);border-left:2px solid var(--border-subtle);padding-left:20px;margin:0 0 24px}
.psg .sec{font-size:var(--type-caption);line-height:20px;color:var(--text-tertiary);margin:0 0 8px}
.psg p{font:400 var(--type-reading)/1.75 var(--font-family-reading);margin:0 0 16px;color:var(--text-secondary)}
.psg p.cited{color:var(--text-primary)}
.psg.on{border-left-color:var(--accent)}

/* Note page, focus mode */
.wide{display:grid;grid-template-columns:minmax(0,600px) 264px;column-gap:48px;justify-content:center;padding:32px 48px 64px}
.wide>.full{grid-column:1/-1}
.margin{font-size:var(--type-caption);line-height:20px;color:var(--text-secondary)}
.mb{padding:0 0 16px;margin:0 0 16px;border-bottom:1px solid var(--border-subtle)}
.mb:last-child{border-bottom:0}
.mb h4{font-size:var(--type-caption);font-weight:var(--weight-semibold);color:var(--text-primary);margin:0 0 4px}
.ecard{position:relative;max-height:calc(100vh - 120px);overflow:auto;border:1px solid var(--border-subtle);border-radius:var(--radius-3);background:var(--surface-raised);box-shadow:var(--shadow-pop);padding:12px;font-size:var(--type-caption);line-height:20px;color:var(--text-secondary)}
.ecard q{display:block;font:italic 400 var(--type-small)/1.55 var(--font-family-reading);color:var(--text-primary);margin:2px 0 8px}
.ecard .goes{padding:8px;border-radius:var(--radius-2);background:var(--surface-soft);margin:8px 0}
.ecard .lb{color:var(--text-tertiary)}

/* Settings */
.set{display:grid;grid-template-columns:288px minmax(0,1fr);height:100%}
.set-nav{border-right:1px solid var(--border-subtle);padding:20px 16px 24px 24px;overflow:auto}
.set-nav h2{font:var(--weight-semibold) var(--type-title)/1.35 var(--font-family-reading);margin:0 0 12px}
.secb{display:flex;gap:12px;align-items:flex-start;width:100%;padding:8px;border-radius:var(--radius-3)}
.secb:hover{background:var(--surface-hover)}
.secb[aria-current=true]{background:var(--surface-selected);box-shadow:inset 2px 0 0 var(--accent)}
.secb .ic{margin-top:2px;color:var(--text-secondary)}
.secb .t{font-size:var(--type-small);line-height:20px;font-weight:var(--weight-medium)}
.secb .m{font-size:var(--type-caption);line-height:16px;color:var(--text-tertiary)}
.secb .chg{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:var(--type-caption);color:var(--text-secondary);white-space:nowrap}
.secb .chg::before,.chgmark::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.set-b{overflow:auto;background:var(--surface-raised)}
.set-in{max-width:720px;padding:24px 40px 48px}
.set-in h2{font:var(--weight-semibold) var(--type-display)/1.3 var(--font-family-reading)}
.sgh{font-size:var(--type-small);font-weight:var(--weight-semibold);margin:32px 0 4px;color:var(--text-primary)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 24px;align-items:center;padding:16px 0;border-bottom:1px solid var(--border-subtle)}
.srow .l{font-size:var(--type-body);font-weight:var(--weight-medium);display:flex;align-items:center;gap:8px}
.srow .h{grid-column:1;font-size:var(--type-small);line-height:20px;color:var(--text-secondary);max-width:440px;text-wrap:pretty}
.srow .ctl{grid-column:2;grid-row:1/3;align-self:center}
.srow.changed{box-shadow:inset 2px 0 0 var(--accent);padding-left:16px;margin-left:-16px}
.chgmark{display:inline-flex;align-items:center;gap:4px;font-size:var(--type-caption);color:var(--text-secondary);font-weight:var(--weight-semibold)}
.sel2{height:32px;display:inline-flex;align-items:center;gap:8px;padding:0 8px 0 12px;border:1px solid var(--border-strong);border-radius:var(--radius-2);background:var(--surface-raised);font-size:var(--type-small);min-width:200px;justify-content:space-between}
.sw{width:36px;height:20px;border-radius:10px;background:var(--accent);position:relative;display:inline-block}
.sw::after{content:"";position:absolute;top:2px;left:18px;width:16px;height:16px;border-radius:50%;background:var(--text-on-solid)}

/* Empty states and first run */
.first{max-width:880px;margin:0 auto;padding:32px 48px 48px}
.stepsx{display:flex;gap:24px;align-items:center;margin:0 0 20px;font-size:var(--type-small);color:var(--text-secondary)}
.stepsx span{display:inline-flex;align-items:center;gap:8px}
.stepsx .ok{color:var(--state-success)}.stepsx .ok b{color:var(--text-secondary);font-weight:var(--weight-regular)}
.stepsx .now{color:var(--text-primary);font-weight:var(--weight-semibold)}
.stepsx .bul{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:var(--type-caption);font-weight:var(--weight-bold);background:var(--accent);color:var(--text-on-solid)}
.drop{border:1.5px dashed var(--border-strong);border-radius:var(--radius-4);background:var(--surface-raised);padding:24px 32px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin:20px 0 12px}
.drop .big{width:48px;height:48px;border-radius:50%;background:var(--surface-selected);color:var(--accent);display:flex;align-items:center;justify-content:center}
.drop h3{font-size:var(--type-body);font-weight:var(--weight-semibold)}
.mode{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--border-subtle);width:100%}
.promise{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;margin-top:28px}
.guar li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--border-subtle)}
.guar .ic{color:var(--state-success);margin-top:2px}
.guar b{display:block;font-size:var(--type-small);font-weight:var(--weight-semibold)}
.guar span{font-size:var(--type-caption);line-height:20px;color:var(--text-secondary)}
.emptybox{border:1.5px dashed var(--border-strong);border-radius:var(--radius-3);padding:16px;font-size:var(--type-caption);line-height:20px;color:var(--text-secondary)}
.estack{flex:1;display:flex;align-items:center;justify-content:center;background:var(--surface-canvas)}
.estack-in{max-width:440px;padding:32px}

/* States board */
.board{padding:24px 32px 48px;max-width:1280px}
.board h1{font:var(--weight-semibold) var(--type-display)/1.3 var(--font-family-reading);margin:0 0 4px}
.board>p{font-size:var(--type-small);color:var(--text-secondary);margin:0 0 20px}
.bgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.frame{display:flex;flex-direction:column;gap:8px;min-width:0}
.frame .cap0{font-size:var(--type-caption);font-weight:var(--weight-semibold);color:var(--text-secondary)}
.frame .box{border:1px solid var(--border-subtle);border-radius:var(--radius-3);overflow:hidden;background:var(--surface-canvas);min-height:120px}
.frame .box.raised{background:var(--surface-raised)}
.frame.w2{grid-column:span 2}

/* ============================================================================================ RESPONSIVE */
@media (min-width:1440px){:root{--nav-w:272px;--ctx-w:320px;--prev-w:240px}}
@media (max-width:1279px){
  .ws{grid-template-columns:var(--nav-w) minmax(0,1fr) 40px}
  .ws.focus{grid-template-columns:minmax(0,1fr)}
  .ws>.ctx{display:none}
  .ctx-strip{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;border-left:1px solid var(--border-subtle);background:var(--surface-canvas);color:var(--text-secondary)}
  .ctx-strip:hover{background:var(--surface-hover)}
  .ctx-strip .vt{writing-mode:vertical-rl;font-size:var(--type-small);line-height:20px;color:var(--text-primary)}
  .ctx-strip .vt .kw2{color:var(--text-tertiary)}
  .inlinesrc{display:block}
  .qtray{display:block;flex:none;border-top:1px solid var(--border-subtle);background:var(--surface-canvas);padding:8px 24px 12px;max-height:128px;overflow:auto}
  .qtray q{display:block;font:italic 400 var(--type-small)/1.55 var(--font-family-reading);color:var(--text-primary);margin:4px 0}
  .relfull-when-strip{display:block!important}.relsum-when-docked{display:none!important}
  /* The strip opens the context as an overlay over the top panel's right edge; Esc or the strip closes it. */
  .ws.ctx-open{position:relative}
  .ws.ctx-open>.ctx{display:flex;position:absolute;z-index:12;top:0;bottom:0;right:40px;width:var(--ctx-w);background:var(--surface-raised);box-shadow:var(--shadow-pop);border-left:0}
  .ws.ctx-open .ctx-strip{background:var(--surface-selected);box-shadow:inset 2px 0 0 var(--accent);color:var(--text-primary)}
}
@media (max-width:1179px){
  :root{--rail-w:64px;--nav-w:224px;--prev-w:216px;--ind:8px;--top-pl:16px;--top-gap:12px}
  .ri{width:56px}
  .tr:not(.cur):not(:hover):not(:focus-visible):not(.fv) .ct{display:none}
  .pill .gard{display:none}
  .home-in{padding:24px 32px 40px}
  .brief{gap:32px}
  .cols{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"need arr" "gard back";gap:24px 32px}
  .a-back{padding-top:0}
  .ibx{grid-template-columns:300px minmax(0,1fr)}
  .ibx-scroll{padding:20px 24px}
  .ibx-act,.verbs{padding-left:24px;padding-right:24px}
  .ibx-act .note{display:none}
  .keybar .rule{display:none}
  .pair{grid-template-columns:minmax(0,1fr)}
  .pmid{flex-direction:row}
  .col-added,.col-notes{display:none}
  .map{grid-template-columns:minmax(0,1fr) 336px}
  .wide{grid-template-columns:minmax(0,560px) 224px;column-gap:32px;padding:24px 32px 48px}
  .set{grid-template-columns:248px minmax(0,1fr)}
  .steps{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:12px}
  .steps li:nth-child(3)::before{display:none}

    ${F('Geração · precisa de você',`<div style="padding:12px"><div class="gen" style="margin:0"><p class="sm inl">${ic('blockf',16,'')}<span class="b5">Idioma não detectado</span></p><p class="cap t2" style="margin:4px 0 8px">Sem o idioma, aula-04.txt não vira notas. Os trechos já estão buscáveis.</p><div style="display:flex;gap:8px"><span class="sel2" style="min-width:160px">Português${ic('cd',14)}</span><button class="btn s">Confirmar</button></div></div></div>`)}
    ${F('Caixa de entrada · vazia',`<div style="padding:16px" class="sm t2 pretty"><p class="ibx-empty">Nada precisa de você. O Jardineiro pergunta aqui quando uma mudança é arriscada.</p><a class="lnk sm" href="#inbox" style="display:inline-block;margin-top:8px">Ver resolvidas</a></div>`)}
   </div></div>`;
  return body;
};

/* ----------------------------------------------------------------------------------------- router */
const TITLES={home:'Início',explore:'Explorar',note:'Nota em foco',source:'Fonte',cmdk:'Comando',ask:'Pergunta',passage:'Trecho citado',library:'Biblioteca',peek:'Espiar',inbox:'Caixa de entrada','inbox-relation':'Caixa de entrada: conexão',map:'Mapa','map-graph':'Mapa: grafo',empty:'Primeira fonte','first-import':'Primeira importação','empty-explore':'Explorar vazio',settings:'Ajustes',activity:'Atividade',topic:'Tópico',entity:'Entidade','add-menu':'Adicionar','keys':'Atalhos','drop':'Soltar arquivos','states':'Estados','explore-focus':'Foco do teclado','explore-ctx':'Contexto aberto (compacto)'};
function render(){
  const k=(location.hash||'#home').slice(1);
  const f=S[k]||S.home;
  document.body.classList.toggle('board-page',k==='states');
  document.getElementById('app').innerHTML=f();
  document.title='Memora Eterna · '+(TITLES[k]||'Início');
  if(k==='explore-focus')['.tr[title^="Fermentação alcoólica"]','.ctx .ci','.phd .btn.quiet'].forEach(s=>{const el=document.querySelector(s);if(el)el.classList.add('fv')});
  if(k==='explore-ctx'){const w=document.querySelector('.ws');if(w)w.classList.add('ctx-open');const b=document.querySelector('.ctx-strip');if(b)b.setAttribute('aria-expanded','true')}
  nbsp(document.getElementById('app'));
  fitTree();fitIcicleDiff();fitMap();fitAfter();
}
/* A separator never starts a line: the trailing clause of a place ribbon drops its dot when it wraps. */
function fitAfter(){document.querySelectorAll('.rib .aft').forEach(a=>{const p=a.previousElementSibling;a.classList.toggle('nl',!!p&&a.getBoundingClientRect().top>p.getBoundingClientRect().top+4)})}
/* Number and noun never split; "p. 47" and "US$ 1,80" never split. */
function nbsp(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{if(n.parentElement&&n.parentElement.closest('kbd,script,style'))return;const t=n.nodeValue;
    const r=t.replace(/(\d)\s+(?=[\p{L}%°~])/gu,'$1 ').replace(/\b(p\.|v\.|cap\.|US\$)\s+(?=\d)/g,'$1 ').replace(/(\d)\s+(de)\s+(?=~?\d)/g,'$1 $2 ').replace(/[\w-]+\.(?:txt|pdf|md|epub)\b/g,f=>f.replace(/-(?!\u2060)/g,'-\u2060'));if(r!==t)n.nodeValue=r});
}
/* Tree: drop +N and tags first, then the count; the open row and its ancestors wrap to 2 lines; others truncate in the middle. */
function cut(s,k,hf=.5){if(k>=s.length)return s;let h=Math.ceil(k*hf),t=k-h;let head=s.slice(0,h),tail=s.slice(s.length-t);
  const hs=head.lastIndexOf(' ');if(hs>3)head=head.slice(0,hs);const ts=tail.indexOf(' ');if(ts>=0&&ts<tail.length-3)tail=tail.slice(ts+1);
  return head.replace(/[\s,]+$/,'')+'…'+tail}
/* Text advance width, unrounded: scrollWidth rounds, while the browser draws an ellipsis for any overflow. */
function textW(el){const r=document.createRange();r.selectNodeContents(el);return r.getBoundingClientRect().width}
function fitTree(){
  document.querySelectorAll('.tr').forEach(r=>{const nm=r.querySelector('.nm');if(!nm)return;const over=()=>textW(nm)>nm.getBoundingClientRect().width+.005;
    if(!over())return;r.classList.add('drop-plus');if(!over())return;
    if(!r.classList.contains('cur')&&!r.matches(':hover')){r.classList.add('drop-ct');if(!over())return}
    if(r.classList.contains('cur')||r.classList.contains('anc')||r.classList.contains('tent')){r.classList.add('wrap');return}
    if(r.classList.contains('more'))return;const hf=r.querySelector('.g.k-topic')?.42:.66;
    const full=nm.dataset.full||nm.textContent;nm.classList.add('mid');let lo=4,hi=full.length;
    while(lo<hi){const m=Math.ceil((lo+hi)/2);nm.textContent=cut(full,m,hf);if(over())hi=m-1;else lo=m}nm.textContent=cut(full,lo,hf)});
}
/* Inbox icicle: name + count, then name; a cell never shows a bare count; what still does not fit gets a letter keyed under the lanes. */
function fitIcicleDiff(){
  const over=d=>d.scrollWidth>d.clientWidth+1;let letter=0;const keyed=[];const seen={};
  document.querySelectorAll('.diff').forEach(diff=>{
    diff.querySelectorAll('.cell').forEach(c=>{const d=c.firstElementChild;if(!d||c.classList.contains('blank')||!over(d))return;
      c.classList.add('nocount');if(!over(d))return;
      const nm=c.dataset.name;let L=seen[nm];if(!L){L=String.fromCharCode(97+letter++);seen[nm]=L;keyed.push([L,nm,c.dataset.count,c.classList.contains('out')])}
      c.classList.remove('nocount');c.classList.add('keyed');c.querySelector('.key').textContent=L;c.setAttribute('aria-label',`${nm}, ${c.dataset.count} notas`)});
    const kl=diff.querySelector('.lanekey');if(kl)kl.innerHTML=keyed.length?keyed.map(([L,n,c,o])=>`<span><span class="key">${L}</span>${n} · ${c} notas${o?' (sai)':''}</span>`).join(''):'';
    if(kl&&!keyed.length)kl.style.display='none';
  });
}
/* Map: merge runs of blocks shorter than 18 px into one "mais N" block; the table keeps all of them. */
function fitMap(){
  document.querySelectorAll('.icsub').forEach(sub=>{
    const rows=[...sub.children];let run=[];
    const flush=()=>{if(run.length>=1){const sum=run.reduce((s,r)=>s+Number(r.dataset.c),0);const m=document.createElement('div');m.className='icr mrg';m.style.flex=`${sum} 1 0`;
      m.innerHTML=`<div class="icc merged" title="${run.map(r=>r.dataset.n+' · '+r.dataset.c).join('; ')}"><span class="icn">${run.length===1?run[0].dataset.n+' '+sum:'mais '+run.length+' · '+sum+' notas'}</span></div>`;run[0].before(m);run.forEach(r=>r.remove())}run=[]};
    rows.forEach(r=>{const c=r.querySelector(':scope>.icc');if(c&&c.getBoundingClientRect().height<18&&!c.classList.contains('here')&&!c.classList.contains('sel'))run.push(r);else flush()});flush();
  });
  document.querySelectorAll('.icc').forEach(c=>{if(c.clientHeight<14){c.classList.add('nolabel');return}if(c.scrollWidth>c.clientWidth+1)c.classList.add('nocount');if(c.scrollWidth>c.clientWidth+1){c.classList.remove('nocount');c.classList.add('nolabel')}});
}
addEventListener('hashchange',render);
addEventListener('resize',()=>{render()});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-theme-set]');
  if(t){const r=document.documentElement;if(t.dataset.themeSet)r.dataset.theme=t.dataset.themeSet;else delete r.dataset.theme;render();return}
  const go=e.target.closest('[data-go]');if(go){location.hash=go.dataset.go}
});
document.addEventListener('mouseover',e=>{
  const c=e.target.closest('.cite');if(!c)return;
  document.querySelectorAll('.cite').forEach(x=>x.classList.toggle('on',x===c));
  document.querySelectorAll('.src-i[data-n]').forEach(x=>x.classList.toggle('on',x.dataset.n===c.dataset.n));
});
document.addEventListener('keydown',e=>{
  const k=location.hash.slice(1);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();location.hash='#cmdk';return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='y'&&k==='library'){e.preventDefault();location.hash='#peek';return}
  if(e.target.closest('input,textarea,[contenteditable]'))return;
  if(e.key==='Escape'){if(['cmdk','note','activity','ask','map','keys','add-menu','passage','explore-ctx'].includes(k))location.hash='#explore';if(k==='peek')location.hash='#library';if(k==='drop')location.hash='#home'}
  if(e.key==='?'&&!['keys'].includes(k)){location.hash='#keys'}
  if(e.key===' '&&k==='library'){e.preventDefault();location.hash='#peek'} else if(e.key===' '&&k==='peek'){e.preventDefault();location.hash='#library'}
});
render();
/* Fitting measures text: run it again once the embedded fonts are ready and whenever the system theme flips. */
if(document.fonts)document.fonts.ready.then(render);
addEventListener('load',render);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);

</script>
